<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMM CRACK - TAO KEY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0000;background-image:radial-gradient(circle at 50% 0%,#7a0000 0%,#3a0000 30%,#150000 60%,#000 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{width:560px;max-width:100%;padding:36px 32px;background:linear-gradient(160deg,#5a0000 0%,#2a0000 40%,#1a0000 70%,#3a0000 100%);border-radius:26px;border:2px solid #ff0033;box-shadow:0 0 35px #ff0033,0 0 80px #ff0033aa,inset 0 0 70px #ff003340;position:relative}
h2{color:#fff;text-align:center;letter-spacing:8px;font-size:28px;font-weight:900;margin-bottom:6px;text-shadow:0 0 14px #ff0033,0 0 28px #ff0033}
.sub{color:#ff5566;text-align:center;font-size:10px;letter-spacing:6px;margin-bottom:20px;font-weight:700}
.divider{height:2px;margin:18px 0;background:linear-gradient(90deg,transparent,#ff6688,#ff0033,#ff6688,transparent);box-shadow:0 0 14px #ff0033}
label{display:block;color:#ff8888;font-size:11px;letter-spacing:3px;font-weight:800;margin-bottom:8px;margin-top:12px}
.inp{width:100%;padding:15px 18px;font-size:15px;letter-spacing:2px;background:#0a0000;border:2px solid #ff003366;border-radius:12px;color:#ff3366;font-weight:700;outline:none;transition:.3s;box-shadow:inset 0 3px 10px rgba(0,0,0,0.8)}
.inp:focus{border-color:#ff3366;color:#fff;box-shadow:0 0 22px #ff0033}
select.inp{cursor:pointer}
select.inp option{background:#1a0000;color:#ff3366}
.row{display:flex;gap:10px}
.row .inp{flex:1}
.btn{width:100%;padding:17px;font-size:15px;font-weight:900;letter-spacing:5px;color:#fff;border:2px solid #ff8899;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#ff3366 0%,#ff0033 50%,#990020 100%);box-shadow:0 0 28px #ff0033;transition:.25s;margin-top:20px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px #ff0033}
#result{display:none;margin-top:20px;padding:22px;background:linear-gradient(180deg,#3a0000,#1a0000);border:2px solid #ff3366;border-radius:16px;box-shadow:0 0 30px #ff0033}
#result.show{display:block}
#keyOut{font-size:22px;font-weight:900;letter-spacing:3px;text-align:center;color:#fff;padding:20px;border-radius:12px;margin-bottom:14px;background:#0a0000;border:2px dashed #ff3366;text-shadow:0 0 20px #ff0033;user-select:all;font-family:monospace;word-break:break-all}
.mini{display:flex;gap:10px}
.mini button{flex:1;padding:12px;font-size:12px;font-weight:900;letter-spacing:3px;border-radius:10px;cursor:pointer;border:2px solid}
.copy{color:#00e0ff;border-color:#00e0ff;background:rgba(0,224,255,0.2)}
.copy:hover{background:#00e0ff;color:#001a22}
.clear{color:#ff5566;border-color:#ff5566;background:rgba(255,85,102,0.2)}
.clear:hover{background:#ff5566;color:#1a0000}
.stat{margin-top:14px;text-align:center;color:#ff5566;font-size:11px;letter-spacing:2px}
.stat b{color:#00ff88}
.list{margin-top:14px;padding:12px;background:#0a0000;border-radius:10px;border:1px solid #ff003333;max-height:200px;overflow-y:auto}
.list h4{color:#ff5566;font-size:10px;letter-spacing:3px;text-align:center;margin-bottom:8px}
.item{display:flex;justify-content:space-between;padding:8px 12px;margin-bottom:5px;background:#1a0000;border-radius:6px;font-size:11px;color:#ff8888;font-family:monospace;border:1px solid #ff003322;flex-wrap:wrap;gap:4px}
.item b{color:#fff;letter-spacing:1px}
.item span{color:#ff5566;font-size:10px}
#customTime{display:none}
#customTime.show{display:block}
</style>
</head>
<body>
<div class="box">
  <h2>KEY GENERATOR</h2>
  <p class="sub">SAMM CRACK</p>
  <div class="divider"></div>

  <label>TEN KHACH</label>
  <input class="inp" id="customer" placeholder="VD: NGUYEN VAN A" maxlength="15">

  <label>LOAI KEY</label>
  <select class="inp" id="duration" onchange="checkType()">
    <option value="hour">THEO GIO</option>
    <option value="day" selected>THEO NGAY</option>
    <option value="week">THEO TUAN</option>
    <option value="month">THEO THANG</option>
    <option value="year">THEO NAM</option>
    <option value="forever">VINH VIEN</option>
    <option value="custom">TUY CHINH GIO</option>
  </select>

  <div id="amountBox">
    <label>SO LUONG</label>
    <input class="inp" id="amount" type="number" value="1" min="1" max="9999">
  </div>

  <div id="customTime">
    <label>CHON NGAY HET HAN</label>
    <input class="inp" id="customDate" type="date">
    <label>CHON GIO HET HAN (24H)</label>
    <div class="row">
      <input class="inp" id="customHour" type="number" placeholder="GIO (0-23)" min="0" max="23" value="23">
      <input class="inp" id="customMin" type="number" placeholder="PHUT (0-59)" min="0" max="59" value="59">
    </div>
  </div>

  <button class="btn" onclick="genKey()">TAO KEY</button>

  <div id="result">
    <div id="keyOut">-</div>
    <div class="mini">
      <button class="copy" onclick="copyKey()">COPY</button>
      <button class="clear" onclick="reset()">XOA</button>
    </div>
  </div>

  <div class="stat">TONG KEY DA TAO: <b id="count">0</b></div>

  <div class="list">
    <h4>DANH SACH KEY DA TAO</h4>
    <div id="listContent"></div>
  </div>
</div>

<script>
var currentKey = "";

function rand4(){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var s = "";
  for(var i = 0; i < 4; i++){
    s += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return s;
}

function makeKey(){
  return rand4() + "-" + rand4() + "-" + rand4();
}

function pad(n){
  if(n < 10) return "0" + n;
  return "" + n;
}

function checkType(){
  var t = document.getElementById("duration").value;
  var ct = document.getElementById("customTime");
  var ab = document.getElementById("amountBox");
  if(t === "custom"){
    ct.classList.add("show");
    ab.style.display = "none";
  } else if(t === "forever"){
    ct.classList.remove("show");
    ab.style.display = "none";
  } else {
    ct.classList.remove("show");
    ab.style.display = "block";
  }
}

function genKey(){
  var cust = document.getElementById("customer").value.trim().toUpperCase();
  if(cust === "") cust = "USER";
  var type = document.getElementById("duration").value;
  var amount = parseInt(document.getElementById("amount").value) || 1;

  var now = Date.now();
  var exp = 0;
  var label = "";

  if(type === "forever"){
    exp = 0;
    label = "VINH VIEN";
  } else if(type === "custom"){
    var d = document.getElementById("customDate").value;
    var h = parseInt(document.getElementById("customHour").value) || 0;
    var m = parseInt(document.getElementById("customMin").value) || 0;
    if(!d){
      alert("VUI LONG CHON NGAY!");
      return;
    }
    var parts = d.split("-");
    var dt = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), h, m, 0);
    exp = dt.getTime();
    label = pad(dt.getDate()) + "/" + pad(dt.getMonth() + 1) + "/" + dt.getFullYear() + " " + pad(h) + ":" + pad(m);
  } else {
    var ms = 0;
    if(type === "hour")  ms = amount * 3600000;
    if(type === "day")   ms = amount * 86400000;
    if(type === "week")  ms = amount * 7 * 86400000;
    if(type === "month") ms = amount * 30 * 86400000;
    if(type === "year")  ms = amount * 365 * 86400000;
    exp = now + ms;
    var labelMap = {hour:"GIO", day:"NGAY", week:"TUAN", month:"THANG", year:"NAM"};
    label = amount + " " + labelMap[type];
  }

  var arr = JSON.parse(localStorage.getItem("samm_keys") || "[]");
  var key = "";
  var tries = 0;
  var duplicate = true;
  while(duplicate && tries < 100){
    key = makeKey();
    duplicate = false;
    for(var i = 0; i < arr.length; i++){
      if(arr[i].key === key){
        duplicate = true;
        break;
      }
    }
    tries++;
  }

  currentKey = key;

  arr.push({
    key: key,
    cust: cust,
    exp: exp,
    label: label,
    time: now
  });
  localStorage.setItem("samm_keys", JSON.stringify(arr));

  document.getElementById("keyOut").textContent = key;
  document.getElementById("result").classList.add("show");
  updateCount();
  renderList();
}

function copyKey(){
  if(!currentKey) return;
  var ta = document.createElement("textarea");
  ta.value = currentKey;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    alert("DA COPY KEY: " + currentKey);
  } catch(e){
    alert("COPY THAT BAI - HAY COPY THU CONG");
  }
  document.body.removeChild(ta);
}

function reset(){
  currentKey = "";
  document.getElementById("result").classList.remove("show");
  document.getElementById("customer").value = "";
}

function updateCount(){
  var arr = JSON.parse(localStorage.getItem("samm_keys") || "[]");
  document.getElementById("count").textContent = arr.length;
}

function renderList(){
  var arr = JSON.parse(localStorage.getItem("samm_keys") || "[]");
  var content = document.getElementById("listContent");
  if(arr.length === 0){
    content.innerHTML = '<div style="text-align:center;color:#ff556688;font-size:11px">CHUA CO KEY NAO</div>';
    return;
  }
  var html = "";
  for(var i = arr.length - 1; i >= 0; i--){
    var it = arr[i];
    html += '<div class="item"><b>' + it.key + '</b><span>' + it.cust + ' - ' + it.label + '</span></div>';
  }
  content.innerHTML = html;
}

checkType();
updateCount();
renderList();
</script>
</body>
</html>
