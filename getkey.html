<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="robots" content="noindex,nofollow">
<title>INNOVA — Admin Tạo Key</title>
<link rel="icon" type="image/png" href="/innova-logo.png">
<link rel="apple-touch-icon" href="/innova-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#05070d;--surface:rgba(17,22,34,.72);--stroke:rgba(255,255,255,.08);--stroke-2:rgba(255,255,255,.14);--txt:#eef2f8;--txt-2:#94a3b8;--txt-3:#5b667a;--brand:#3b82f6;--brand-2:#6366f1;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--r-lg:20px;--r-md:14px;--r-sm:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-0);background-image:radial-gradient(900px 500px at 50% -10%,rgba(59,130,246,.18),transparent 65%),radial-gradient(700px 400px at 100% 110%,rgba(99,102,241,.10),transparent 60%);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 1.25rem) 1.25rem calc(env(safe-area-inset-bottom) + 3rem);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem;animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#loginView{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(24,30,46,.9),rgba(12,16,26,.9));border:1px solid var(--stroke);border-radius:var(--r-lg);padding:2rem 1.6rem;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.9)}
.login-card .logo{width:68px;height:68px;border-radius:20px;object-fit:cover;border:1px solid var(--stroke-2);box-shadow:0 0 24px rgba(59,130,246,.35);margin-bottom:1rem}
.login-card h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.35rem}
.login-card p{font-size:.82rem;color:var(--txt-2);margin-bottom:1.4rem}
.login-input{width:100%;height:48px;background:rgba(0,0,0,.4);border:1px solid var(--stroke-2);border-radius:var(--r-sm);color:#fff;font-family:'JetBrains Mono',monospace;font-size:.95rem;padding:0 14px;outline:none;margin-bottom:.85rem;transition:border-color .15s,box-shadow .15s}
.login-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(59,130,246,.16)}
.login-err{font-size:.78rem;color:#fca5a5;margin-bottom:.85rem;min-height:1em}
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:.25rem .25rem .5rem}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.brand-logo{width:28px;height:28px;border-radius:8px;object-fit:cover;border:1px solid var(--stroke-2);box-shadow:0 0 12px rgba(59,130,246,.35)}
.brand-tag{font-size:.62rem;font-weight:600;padding:3px 7px;border-radius:6px;background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(99,102,241,.25));border:1px solid rgba(99,102,241,.35);color:#c7d2fe}
.logout-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:.72rem;font-weight:600;background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.28);cursor:pointer;transition:background .15s}
.logout-btn:hover{background:rgba(239,68,68,.22)}
.card{background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:1.3rem 1.35rem;box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.card-title{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:700;color:#fff}
.card-title .ico{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(99,102,241,.15));border:1px solid rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;color:#93c5fd;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
.stat{padding:.75rem .6rem;background:rgba(255,255,255,.025);border:1px solid var(--stroke);border-radius:var(--r-sm);text-align:center}
.stat-val{font-size:1.15rem;font-weight:800;font-family:'JetBrains Mono',monospace;color:#fff;letter-spacing:-.02em}
.stat-val.ok{color:#34d399}
.stat-val.err{color:#f87171}
.stat-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-3);font-weight:700;margin-top:3px}
.field{margin-bottom:.85rem}
.field-label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-2);margin-bottom:.4rem}
.input,.select{width:100%;height:46px;background:rgba(0,0,0,.4);border:1px solid var(--stroke-2);border-radius:var(--r-sm);color:#fff;font-family:inherit;font-size:.9rem;padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(59,130,246,.16)}
.select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px;cursor:pointer}
.select option{background:#131a29;color:#fff}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:46px;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .15s,background .15s;padding:0 16px}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 8px 22px -8px rgba(59,130,246,.75)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(59,130,246,.9)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--stroke-2);color:#e2e8f0}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-block{width:100%}
.btn-sm{height:32px;padding:0 10px;font-size:.75rem;border-radius:8px}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:.9rem}
.key-list{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;padding-right:4px}
.key-list::-webkit-scrollbar{width:5px}
.key-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.key-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.7rem .85rem;background:rgba(255,255,255,.025);border:1px solid var(--stroke);border-radius:var(--r-sm);transition:border-color .15s,background .15s}
.key-item:hover{background:rgba(59,130,246,.05);border-color:rgba(59,130,246,.28)}
.key-info{flex:1;min-width:0}
.key-code{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;color:#fff;letter-spacing:.3px;word-break:break-all;margin-bottom:3px}
.key-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.68rem;color:var(--txt-3)}
.pill{padding:2px 7px;border-radius:5px;font-weight:600;font-size:.65rem;letter-spacing:.02em;text-transform:uppercase}
.pill.plan{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.28)}
.pill.active{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.28)}
.pill.used{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.28)}
.pill.expired{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.28)}
.key-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--stroke-2);color:var(--txt-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.icon-btn:hover{background:rgba(59,130,246,.2);color:#fff}
.icon-btn.danger:hover{background:rgba(239,68,68,.25);color:#fff}
.empty{text-align:center;padding:2rem 1rem;color:var(--txt-3);font-size:.82rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(80px);background:rgba(17,22,34,.96);border:1px solid var(--stroke-2);border-radius:999px;padding:.6rem 1.1rem;font-size:.82rem;font-weight:600;color:#fff;backdrop-filter:blur(12px);box-shadow:0 14px 34px -10px rgba(0,0,0,.9);z-index:3000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(16,185,129,.4)}
.toast.err{border-color:rgba(239,68,68,.4)}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wrap">

  <div id="loginView">
    <div class="login-card">
      <img src="/innova-logo.png" alt="INNOVA" class="logo">
      <h2>Admin Panel</h2>
      <p>Nhập mật khẩu quản trị để tiếp tục</p>
      <input type="password" id="adminPass" class="login-input mono" placeholder="••••••••" autocomplete="current-password">
      <div class="login-err" id="loginErr"></div>
      <button type="button" class="btn btn-primary btn-block" id="loginBtn">
        <span id="loginBtnText">Đăng nhập</span>
      </button>
      <p style="margin-top:1rem;font-size:.72rem;color:var(--txt-3)">
        Mặc định: <span class="mono" style="color:#93c5fd">innova2024</span> — hãy đổi trong code!
      </p>
    </div>
  </div>

  <div id="adminView" style="display:none">
    <header class="top-nav">
      <div class="brand">
        <img src="/innova-logo.png" alt="INNOVA" class="brand-logo">
        <span>INNOVA</span>
        <span class="brand-tag">ADMIN</span>
      </div>
      <button type="button" class="logout-btn" id="logoutBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Đăng xuất
      </button>
    </header>

    <div class="stats">
      <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-label">Tổng Key</div></div>
      <div class="stat"><div class="stat-val ok" id="statActive">0</div><div class="stat-label">Chưa dùng</div></div>
      <div class="stat"><div class="stat-val err" id="statUsed">0</div><div class="stat-label">Đã dùng</div></div>
    </div>

    <section class="card">
      <div class="card-head">
        <div class="card-title">
          <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
          <span>Tạo Key mới</span>
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label class="field-label" for="planSelect">Gói thời hạn</label>
          <select id="planSelect" class="select">
            <option value="1H">1 Giờ (1H)</option>
            <option value="3H">3 Giờ (3H)</option>
            <option value="6H">6 Giờ (6H)</option>
            <option value="12H">12 Giờ (12H)</option>
            <option value="1D" selected>1 Ngày (1D)</option>
            <option value="3D">3 Ngày (3D)</option>
            <option value="7D">7 Ngày (7D)</option>
            <option value="15D">15 Ngày (15D)</option>
            <option value="30D">30 Ngày (30D)</option>
            <option value="90D">90 Ngày (90D)</option>
            <option value="365D">365 Ngày (365D)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="quantity">Số lượng</label>
          <input type="number" id="quantity" class="input mono" value="1" min="1" max="100">
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="noteInput">Ghi chú (tùy chọn)</label>
        <input type="text" id="noteInput" class="input" placeholder="VD: Bán cho khách A — Zalo 09xx..." maxlength="80">
      </div>
      <button type="button" class="btn btn-primary btn-block" id="createBtn">
        <span id="createBtnText">Tạo Key</span>
      </button>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="card-title">
          <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <span>Danh sách Key</span>
        </div>
        <div style="display:flex;gap:6px">
          <button type="button" class="btn btn-ghost btn-sm" id="exportTxtBtn">TXT</button>
          <button type="button" class="btn btn-ghost btn-sm" id="exportCsvBtn">CSV</button>
          <button type="button" class="btn btn-ghost btn-sm" id="clearUsedBtn">Xóa hết</button>
        </div>
      </div>
      <div class="filters">
        <input type="text" id="searchInput" class="input" placeholder="Tìm key hoặc ghi chú...">
        <select id="filterStatus" class="select" style="width:auto;min-width:120px">
          <option value="all">Tất cả</option>
          <option value="active">Chưa dùng</option>
          <option value="used">Đã dùng</option>
        </select>
      </div>
      <div class="key-list" id="keyList">
        <div class="empty">Chưa có Key nào. Hãy tạo Key đầu tiên!</div>
      </div>
    </section>

    <div style="text-align:center;font-size:.72rem;color:var(--txt-3);margin-top:.4rem">
      INNOVA Admin Panel • Dữ liệu lưu cục bộ (localStorage)
    </div>
  </div>

</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
(function () {
  "use strict";

  // ================== CẤU HÌNH ==================
  var ADMIN_PASSWORD = "innova2024";
  var STORAGE_KEY = "_innova_admin_keys_v1";
  var SESSION_KEY = "_innova_admin_session";

  var PLAN_MAP = {
    "1H":   { ms: 1 * 60 * 60 * 1000,        label: "1 Giờ" },
    "3H":   { ms: 3 * 60 * 60 * 1000,        label: "3 Giờ" },
    "6H":   { ms: 6 * 60 * 60 * 1000,        label: "6 Giờ" },
    "12H":  { ms: 12 * 60 * 60 * 1000,       label: "12 Giờ" },
    "1D":   { ms: 24 * 60 * 60 * 1000,       label: "1 Ngày" },
    "3D":   { ms: 3 * 24 * 60 * 60 * 1000,   label: "3 Ngày" },
    "7D":   { ms: 7 * 24 * 60 * 60 * 1000,   label: "7 Ngày" },
    "15D":  { ms: 15 * 24 * 60 * 60 * 1000,  label: "15 Ngày" },
    "30D":  { ms: 30 * 24 * 60 * 60 * 1000,  label: "30 Ngày" },
    "90D":  { ms: 90 * 24 * 60 * 60 * 1000,  label: "90 Ngày" },
    "365D": { ms: 365 * 24 * 60 * 60 * 1000, label: "365 Ngày" }
  };

  // ================== STORAGE ==================
  function loadKeys() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveKeys(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  // ================== SINH KEY ==================
  var CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function randBlock(len) {
    len = len || 4;
    var s = "";
    if (window.crypto && window.crypto.getRandomValues) {
      var arr = new Uint32Array(len);
      window.crypto.getRandomValues(arr);
      for (var i = 0; i < len; i++) s += CHARS[arr[i] % CHARS.length];
    } else {
      for (var j = 0; j < len; j++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
    }
    return s;
  }
  function generateKey(plan) {
    return "INNOVA-" + plan + "-" + randBlock() + "-" + randBlock() + "-" + randBlock();
  }

  // ================== DOM ==================
  var $ = function (id) { return document.getElementById(id); };
  var loginView = $("loginView");
  var adminView = $("adminView");
  var adminPass = $("adminPass");
  var loginBtn = $("loginBtn");
  var loginBtnText = $("loginBtnText");
  var loginErr = $("loginErr");
  var logoutBtn = $("logoutBtn");
  var createBtn = $("createBtn");
  var createBtnText = $("createBtnText");
  var planSelect = $("planSelect");
  var quantity = $("quantity");
  var noteInput = $("noteInput");
  var keyList = $("keyList");
  var searchInput = $("searchInput");
  var filterStatus = $("filterStatus");
  var statTotal = $("statTotal");
  var statActive = $("statActive");
  var statUsed = $("statUsed");
  var toast = $("toast");
  var toastMsg = $("toastMsg");

  // ================== TOAST ==================
  var toastTimer = null;
  function showToast(msg, type) {
    toastMsg.textContent = msg;
    toast.className = "toast show " + (type || "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.className = "toast " + (type || "");
    }, 2200);
  }

  // ================== COPY ==================
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return false; });
    }
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return Promise.resolve(true);
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  // ================== LOGIN ==================
  function checkSession() {
    if (sessionStorage.getItem(SESSION_KEY) === "1") {
      loginView.style.display = "none";
      adminView.style.display = "block";
      render();
    } else {
      loginView.style.display = "flex";
      adminView.style.display = "none";
    }
  }

  loginBtn.addEventListener("click", function () {
    var pwd = adminPass.value;
    if (!pwd) {
      loginErr.textContent = "Vui lòng nhập mật khẩu!";
      return;
    }
    loginBtn.disabled = true;
    loginBtnText.innerHTML = '<span class="spinner"></span> Đang kiểm tra...';
    setTimeout(function () {
      if (pwd === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "1");
        loginErr.textContent = "";
        adminPass.value = "";
        loginBtn.disabled = false;
        loginBtnText.textContent = "Đăng nhập";
        checkSession();
        showToast("Đăng nhập thành công", "ok");
      } else {
        loginErr.textContent = "Mật khẩu không đúng!";
        loginBtn.disabled = false;
        loginBtnText.textContent = "Đăng nhập";
      }
    }, 300);
  });

  adminPass.addEventListener("keydown", function (e) {
    if (e.key === "Enter") loginBtn.click();
  });

  logoutBtn.addEventListener("click", function () {
    sessionStorage.removeItem(SESSION_KEY);
    checkSession();
    showToast("Đã đăng xuất");
  });

  // ================== CREATE KEY ==================
  createBtn.addEventListener("click", function () {
    var plan = planSelect.value;
    var qty = Math.max(1, Math.min(100, parseInt(quantity.value, 10) || 1));
    var note = (noteInput.value || "").trim();

    if (!PLAN_MAP[plan]) {
      showToast("Gói không hợp lệ!", "err");
      return;
    }

    createBtn.disabled = true;
    createBtnText.innerHTML = '<span class="spinner"></span> Đang tạo...';

    setTimeout(function () {
      var keys = loadKeys();
      var now = Date.now();
      var created = [];

      for (var i = 0; i < qty; i++) {
        var k = "";
        var tries = 0;
        do {
          k = generateKey(plan);
          tries++;
        } while (keys.some(function (x) { return x.key === k; }) && tries < 10);

        var item = {
          key: k,
          plan: plan,
          planLabel: PLAN_MAP[plan].label,
          durationMs: PLAN_MAP[plan].ms,
          note: note,
          createdAt: now,
          expiresAt: now + PLAN_MAP[plan].ms,
          used: false,
          usedAt: null,
          browserHwid: null
        };
        keys.push(item);
        created.push(item);
      }

      saveKeys(keys);
      createBtn.disabled = false;
      createBtnText.textContent = "Tạo Key";
      render();
      showToast("Đã tạo " + qty + " Key — " + PLAN_MAP[plan].label, "ok");

      if (qty === 1) {
        copyText(created[0].key).then(function (ok) {
          if (ok) showToast("Đã copy Key vào clipboard", "ok");
        });
      }
    }, 250);
  });

  // ================== RENDER ==================
  function getStatus(item) {
    if (item.used) return "used";
    if (item.expiresAt && item.expiresAt < Date.now()) return "expired";
    return "active";
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function render() {
    var keys = loadKeys();
    var search = (searchInput.value || "").trim().toUpperCase();
    var filter = filterStatus.value;

    var active = 0, used = 0;
    keys.forEach(function (k) {
      var s = getStatus(k);
      if (s === "active") active++;
      if (s === "used") used++;
    });
    statTotal.textContent = keys.length;
    statActive.textContent = active;
    statUsed.textContent = used;

    var filtered = keys.slice().reverse();
    if (search) {
      filtered = filtered.filter(function (k) {
        return k.key.toUpperCase().indexOf(search) !== -1 ||
               (k.note || "").toUpperCase().indexOf(search) !== -1;
      });
    }
    if (filter !== "all") {
      filtered = filtered.filter(function (k) { return getStatus(k) === filter; });
    }

    if (filtered.length === 0) {
      keyList.innerHTML = '<div class="empty">Không có Key nào phù hợp.</div>';
      return;
    }

    var html = "";
    filtered.forEach(function (item) {
      var status = getStatus(item);
      var statusLabel = status === "active" ? "Chưa dùng" : status === "used" ? "Đã dùng" : "Hết hạn";
      var statusCls = status === "active" ? "active" : status === "used" ? "used" : "expired";
      var createdStr = new Date(item.createdAt).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
      var expireStr = new Date(item.expiresAt).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });

      html += '<div class="key-item" data-key="' + escapeHtml(item.key) + '">';
      html += '<div class="key-info">';
      html += '<div class="key-code">' + escapeHtml(item.key) + '</div>';
      html += '<div class="key-meta">';
      html += '<span class="pill plan">' + escapeHtml(item.planLabel) + '</span>';
      html += '<span class="pill ' + statusCls + '">' + statusLabel + '</span>';
      html += '<span>• Tạo: ' + createdStr + '</span>';
      html += '<span>• Hết hạn: ' + expireStr + '</span>';
      if (item.note) html += '<span>• 📝 ' + escapeHtml(item.note) + '</span>';
      if (item.browserHwid) html += '<span>• 🔒 ' + escapeHtml(item.browserHwid.slice(0, 14)) + '…</span>';
      html += '</div></div>';
      html += '<div class="key-actions">';
      html += '<button type="button" class="icon-btn" data-action="copy" title="Copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>';
      html += '<button type="button" class="icon-btn danger" data-action="delete" title="Xóa"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>';
      html += '</div></div>';
    });
    keyList.innerHTML = html;
  }

  // ================== KEY LIST ACTIONS ==================
  keyList.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button[data-action]") : null;
    if (!btn) return;
    var item = btn.closest(".key-item");
    if (!item) return;
    var keyCode = item.dataset.key;
    var action = btn.dataset.action;

    if (action === "copy") {
      copyText(keyCode).then(function (ok) {
        showToast(ok ? "Đã copy Key" : "Không thể copy", ok ? "ok" : "err");
      });
    } else if (action === "delete") {
      if (!confirm("Xóa Key này?\n" + keyCode)) return;
      var keys = loadKeys().filter(function (k) { return k.key !== keyCode; });
      saveKeys(keys);
      render();
      showToast("Đã xóa Key", "ok");
    }
  });

  searchInput.addEventListener("input", render);
  filterStatus.addEventListener("change", render);

  // ================== EXPORT ==================
  function downloadFile(filename, content, mime) {
    var blob = new Blob([content], { type: (mime || "text/plain") + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  $("exportTxtBtn").addEventListener("click", function () {
    var keys = loadKeys();
    if (keys.length === 0) { showToast("Chưa có Key nào!", "err"); return; }
    var lines = keys.map(function (k) {
      var s = getStatus(k);
      var statusVN = s === "active" ? "CHUA_DUNG" : s === "used" ? "DA_DUNG" : "HET_HAN";
      return k.key + " | " + k.plan + " | " + statusVN + " | HetHan:" + new Date(k.expiresAt).toLocaleString("vi-VN") + (k.note ? " | Note:" + k.note : "");
    });
    downloadFile("innova-keys-" + Date.now() + ".txt", lines.join("\n"));
    showToast("Đã xuất file TXT", "ok");
  });

  $("exportCsvBtn").addEventListener("click", function () {
    var keys = loadKeys();
    if (keys.length === 0) { showToast("Chưa có Key nào!", "err"); return; }
    function esc(v) { return '"' + String(v || "").replace(/"/g, '""') + '"'; }
    var rows = keys.map(function (k) {
      var s = getStatus(k);
      var statusVN = s === "active" ? "Chua dung" : s === "used" ? "Da dung" : "Het han";
      return [esc(k.key), esc(k.plan), esc(statusVN), esc(new Date(k.createdAt).toLocaleString("vi-VN")), esc(new Date(k.expiresAt).toLocaleString("vi-VN")), esc(k.note || ""), esc(k.browserHwid || "")].join(",");
    });
    downloadFile("innova-keys-" + Date.now() + ".csv", "Key,Goi,TrangThai,TaoLuc,HetHan,GhiChu,HWID\n" + rows.join("\n"), "text/csv");
    showToast("Đã xuất file CSV", "ok");
  });

  $("clearUsedBtn").addEventListener("click", function () {
    var keys = loadKeys();
    if (keys.length === 0) { showToast("Chưa có Key nào!", "err"); return; }
    if (!confirm("Xóa TOÀN BỘ Key? Hành động này không thể hoàn tác!")) return;
    saveKeys([]);
    render();
    showToast("Đã xóa toàn bộ Key", "ok");
  });

  // ================== INIT ==================
  checkSession();
})();
</script>
</body>
</html>
