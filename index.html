<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SAMM VIP</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
    }

    /* ===== MATRIX RAIN ===== */
    .matrix-canvas {
        position: fixed; inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s;
    }
    .matrix-canvas.show { opacity: 0.75; }

    /* ===== ESP ===== */
    .esp-layer {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 100;
    }
    .esp-box {
        position: absolute;
        border: 2px solid #00FF41;
        border-radius: 4px;
        box-shadow: 0 0 12px rgba(0,255,65,0.8), inset 0 0 20px rgba(0,255,65,0.1);
        display: none;
        animation: boxPulse 2s infinite;
    }
    .esp-box.show { display: block; }
    @keyframes boxPulse {
        0%,100% { box-shadow: 0 0 12px rgba(0,255,65,0.8), inset 0 0 20px rgba(0,255,65,0.1); }
        50% { box-shadow: 0 0 20px rgba(0,255,65,1), inset 0 0 30px rgba(0,255,65,0.2); }
    }

    .esp-name {
        position: absolute;
        font-size: 11px;
        color: #00FF41;
        font-family: "Courier New", monospace;
        font-weight: bold;
        text-shadow: 0 0 6px #00FF41, 0 0 2px #000;
        white-space: nowrap;
        display: none;
    }
    .esp-name.show { display: block; }
    .esp-name::before {
        content: "> ";
        color: #00FF41;
    }

    .esp-health {
        position: absolute;
        width: 4px;
        background: linear-gradient(to bottom, #00FF41, #00AA22);
        border-radius: 2px;
        display: none;
        box-shadow: 0 0 8px #00FF41;
    }
    .esp-health.show { display: block; }

    .esp-health-bg {
        position: absolute;
        width: 4px;
        background: rgba(0,0,0,0.7);
        border-radius: 2px;
        display: none;
        border: 1px solid rgba(0,255,65,0.3);
    }
    .esp-health-bg.show { display: block; }

    .esp-distance {
        position: absolute;
        font-size: 10px;
        color: #00FF41;
        font-family: "Courier New", monospace;
        font-weight: bold;
        text-shadow: 0 0 6px #00FF41, 0 0 2px #000;
        display: none;
    }
    .esp-distance.show { display: block; }

    .esp-skeleton {
        position: absolute;
        width: 100%; height: 100%;
        top: 0; left: 0;
        display: none;
    }
    .esp-skeleton.show { display: block; }
    .esp-skeleton line {
        stroke: #00FF41;
        stroke-width: 2;
        opacity: 0.9;
        filter: drop-shadow(0 0 4px #00FF41);
    }

    .esp-tracer {
        position: absolute;
        bottom: 0; left: 50%;
        width: 2px;
        height: 50%;
        background: linear-gradient(to top, #00FF41, transparent);
        transform-origin: bottom center;
        transform: rotate(-15deg);
        display: none;
        box-shadow: 0 0 8px #00FF41;
    }
    .esp-tracer.show { display: block; }

    .enemy-count {
        position: fixed;
        top: 20px; left: 50%;
        transform: translateX(-50%);
        font-size: 22px;
        font-weight: 800;
        font-family: "Courier New", monospace;
        color: #00FF41;
        text-shadow: 0 0 10px #00FF41, 0 0 4px #000;
        display: none;
        z-index: 102;
        letter-spacing: 3px;
        animation: glitch 2s infinite;
    }
    .enemy-count.show { display: block; }
    @keyframes glitch {
        0%,90%,100% { transform: translateX(-50%); }
        92% { transform: translateX(calc(-50% - 3px)); }
        94% { transform: translateX(calc(-50% + 3px)); }
        96% { transform: translateX(-50%); }
    }

    .aim-crosshair {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 40px; height: 40px;
        display: none;
        z-index: 101;
    }
    .aim-crosshair.show { display: block; }
    .aim-crosshair::before,
    .aim-crosshair::after {
        content: "";
        position: absolute;
        background: #00FF41;
        box-shadow: 0 0 8px #00FF41;
    }
    .aim-crosshair::before {
        width: 2px; height: 100%;
        left: 50%; top: 0;
        transform: translateX(-50%);
    }
    .aim-crosshair::after {
        height: 2px; width: 100%;
        top: 50%; left: 0;
        transform: translateY(-50%);
    }

    .aim-neck {
        position: fixed;
        top: 45%; left: 50%;
        transform: translate(-50%, -50%);
        width: 24px; height: 24px;
        border: 2px dashed #FFD700;
        border-radius: 50%;
        display: none;
        z-index: 101;
        box-shadow: 0 0 10px #FFD700;
    }
    .aim-neck.show { display: block; }

    .aim-lock {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 60px; height: 60px;
        border: 2px solid #FF5252;
        border-radius: 50%;
        display: none;
        z-index: 101;
        animation: lockPulse 1s infinite;
        box-shadow: 0 0 15px #FF5252;
    }
    .aim-lock.show { display: block; }
    @keyframes lockPulse {
        0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.5; }
    }

    /* ===== MENU ===== */
    .menu {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        width: 340px;
        background: rgba(10, 15, 30, 0.97);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,255,65,0.3);
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        z-index: 9999;
        display: none;
    }
    .menu.show {
        display: block;
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%) scale(1);
    }

    .menu-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 12px;
    }
    .brand .title {
        font-size: 20px; font-weight: 800;
        background: linear-gradient(90deg, #fff, #00FF41);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
    }
    .brand .sub {
        font-size: 10px; color: #00FF41;
        letter-spacing: 3px; margin-top: 2px;
    }
    .close-btn {
        width: 28px; height: 28px;
        background: #E53935;
        border: none; border-radius: 6px;
        color: #fff; font-weight: bold;
        cursor: pointer; font-size: 14px;
    }

    .tabs {
        display: flex; gap: 4px;
        margin-bottom: 12px;
        border-bottom: 1px solid #1e3a5f;
        padding-bottom: 8px;
    }
    .tab {
        flex: 1;
        padding: 6px 4px;
        text-align: center;
        font-size: 11px;
        color: #666;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.2s;
    }
    .tab.active {
        color: #00FF41;
        background: rgba(0,255,65,0.15);
        font-weight: 600;
    }

    .features { max-height: 380px; overflow-y: auto; }
    .features::-webkit-scrollbar { width: 4px; }
    .features::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

    .feature {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 8px;
        border-radius: 8px;
        margin-bottom: 4px;
        transition: background 0.2s;
    }
    .feature:hover { background: rgba(0,255,65,0.08); }
    .feature span { font-size: 13px; color: #ddd; }

    .switch {
        position: relative;
        width: 44px; height: 24px;
        background: #2a2a3e;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.25s;
        flex-shrink: 0;
    }
    .switch::after {
        content: "";
        position: absolute;
        top: 3px; left: 3px;
        width: 18px; height: 18px;
        background: #666;
        border-radius: 50%;
        transition: all 0.25s;
    }
    .switch.on { background: #00FF41; }
    .switch.on::after {
        left: 23px;
        background: #fff;
        box-shadow: 0 0 8px rgba(0,255,65,0.8);
    }

    .status {
        display: flex; align-items: center; gap: 6px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #1e3a5f;
        font-size: 11px; color: #00FF41;
    }
    .status::before {
        content: "";
        width: 7px; height: 7px;
        background: #00FF41;
        border-radius: 50%;
        box-shadow: 0 0 8px #00FF41;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0%,100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    .section-title {
        font-size: 10px;
        color: #00FF41;
        letter-spacing: 2px;
        padding: 8px 8px 4px;
        font-weight: 700;
    }
    .music-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
        margin-bottom: 4px;
    }
    .music-item:hover { background: rgba(0,255,65,0.1); }
    .music-item.playing { background: rgba(0,255,65,0.2); }
    .music-icon {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: #1e3a5f;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
        color: #00FF41;
    }
    .music-item.playing .music-icon {
        background: #00FF41;
        color: #000;
        animation: pulse 1s infinite;
    }
    .music-name {
        font-size: 12px; color: #ddd;
        flex: 1;
    }
    .music-item.playing .music-name { color: #00FF41; font-weight: 600; }
</style>
</head>
<body>

<canvas class="matrix-canvas" id="matrixCanvas"></canvas>

<div class="esp-layer">
    <div class="esp-box" id="espBox1" style="top:25%; left:20%; width:120px; height:180px;"></div>
    <div class="esp-health-bg" id="espHBg1" style="top:25%; left:calc(20% + 124px); height:180px;"></div>
    <div class="esp-health" id="espHealth1" style="top:25%; left:calc(20% + 124px); height:120px;"></div>
    <div class="esp-name" id="espName1" style="top:calc(25% - 18px); left:20%;">Player_01</div>
    <div class="esp-distance" id="espDist1" style="top:calc(25% + 185px); left:20%;">[32m]</div>

    <div class="esp-box" id="espBox2" style="top:35%; left:65%; width:100px; height:150px;"></div>
    <div class="esp-health-bg" id="espHBg2" style="top:35%; left:calc(65% + 104px); height:150px;"></div>
    <div class="esp-health" id="espHealth2" style="top:35%; left:calc(65% + 104px); height:90px;"></div>
    <div class="esp-name" id="espName2" style="top:calc(35% - 18px); left:65%;">Player_02</div>
    <div class="esp-distance" id="espDist2" style="top:calc(35% + 155px); left:65%;">[58m]</div>

    <svg class="esp-skeleton" id="espSkeleton">
        <line x1="26%" y1="28%" x2="26%" y2="40%"/>
        <line x1="26%" y1="30%" x2="22%" y2="34%"/>
        <line x1="26%" y1="30%" x2="30%" y2="34%"/>
        <line x1="26%" y1="40%" x2="23%" y2="50%"/>
        <line x1="26%" y1="40%" x2="29%" y2="50%"/>
        <line x1="26%" y1="28%" x2="26%" y2="26%"/>
    </svg>

    <div class="esp-tracer" id="espTracer"></div>
</div>

<div class="enemy-count" id="enemyCount">ENEMY: 4</div>

<div class="aim-crosshair" id="aimCrosshair"></div>
<div class="aim-neck" id="aimNeck"></div>
<div class="aim-lock" id="aimLock"></div>

<div class="menu" id="menu">
    <div class="menu-header">
        <div class="brand">
            <div class="title">SAMM VIP</div>
            <div class="sub">VIP SUITE</div>
        </div>
        <button class="close-btn" onclick="hideMenu()">X</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="esp">ESP</div>
        <div class="tab" data-tab="aim">AIM</div>
        <div class="tab" data-tab="misc">MISC</div>
        <div class="tab" data-tab="colors">COLORS</div>
        <div class="tab" data-tab="settings">SETTINGS</div>
    </div>

    <div class="features" id="features"></div>

    <div class="status">ONLINE</div>
</div>

<script>
    var tabData = {
        esp: [
            { name: "Enable ESP", on: false, key: "enableEsp" },
            { name: "Player box", on: false, key: "playerBox" },
            { name: "Top tracer", on: false, key: "topTracer" },
            { name: "Line target: TOP", on: false, key: "lineTarget" },
            { name: "Health bar", on: false, key: "healthBar" },
            { name: "Player name", on: false, key: "playerName" },
            { name: "Distance", on: false, key: "distance" },
            { name: "Skeleton", on: false, key: "skeleton" },
            { name: "Enemy count", on: false, key: "enemyCount" }
        ],
        aim: [
            { name: "AIM BOT", on: false, key: "aimBot" },
            { name: "AIMNECK", on: false, key: "aimNeck" },
            { name: "AIMLOCK", on: false, key: "aimLock" }
        ],
        misc: "music",
        colors: [
            { name: "Box color", on: false, key: "cBox" },
            { name: "Tracer color", on: false, key: "cTracer" },
            { name: "Name color", on: false, key: "cName" },
            { name: "Skeleton color", on: false, key: "cSkeleton" }
        ],
        settings: [
            { name: "Save config", on: false, key: "saveConfig" },
            { name: "Auto load", on: false, key: "autoLoad" },
            { name: "Anti screenshot", on: false, key: "antiSS" }
        ]
    };

    var musicList = [
        { name: "Nhac 1", url: "https://files.catbox.moe/zy9l6e.mp3" },
        { name: "Nhac 2", url: "https://files.catbox.moe/g65v1o.mp3" },
        { name: "Nhac 3", url: "https://files.catbox.moe/zy9l6e.mp3" }
    ];

    var currentTab = "esp";
    var currentMusic = -1;
    var audio = new Audio();
    var container = document.getElementById("features");

    // MATRIX RAIN
    var canvas = document.getElementById("matrixCanvas");
    var ctx = canvas.getContext("2d");
    var matrixInterval = null;
    var columns = [];
    var fontSize = 14;
    var chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*(){}[]<>";

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var colCount = Math.floor(canvas.width / fontSize);
        columns = [];
        for (var i = 0; i < colCount; i++) {
            columns[i] = Math.random() * canvas.height / fontSize;
        }
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + "px monospace";

        for (var i = 0; i < columns.length; i++) {
            var text = chars[Math.floor(Math.random() * chars.length)];
            var x = i * fontSize;
            var y = columns[i] * fontSize;

            if (Math.random() > 0.975) {
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "#00FF41";
                ctx.shadowBlur = 10;
            } else {
                ctx.fillStyle = "#00FF41";
                ctx.shadowColor = "#00FF41";
                ctx.shadowBlur = 4;
            }
            ctx.fillText(text, x, y);
            ctx.shadowBlur = 0;

            if (y > canvas.height && Math.random() > 0.975) {
                columns[i] = 0;
            }
            columns[i]++;
        }
    }

    function startMatrix() {
        if (matrixInterval) return;
        resizeCanvas();
        canvas.classList.add("show");
        matrixInterval = setInterval(drawMatrix, 33);
    }

    function stopMatrix() {
        if (matrixInterval) {
            clearInterval(matrixInterval);
            matrixInterval = null;
        }
        canvas.classList.remove("show");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener("resize", function() {
        if (matrixInterval) resizeCanvas();
    });

    // HELPERS
    function getEsp(key) {
        for (var i = 0; i < tabData.esp.length; i++) {
            if (tabData.esp[i].key === key) return tabData.esp[i].on;
        }
        return false;
    }
    function getAim(key) {
        for (var i = 0; i < tabData.aim.length; i++) {
            if (tabData.aim[i].key === key) return tabData.aim[i].on;
        }
        return false;
    }

    function anyFeatureOn() {
        var espOn = false;
        var aimOn = false;
        for (var i = 0; i < tabData.esp.length; i++) {
            if (tabData.esp[i].on && tabData.esp[i].key !== "enableEsp") espOn = true;
        }
        for (var j = 0; j < tabData.aim.length; j++) {
            if (tabData.aim[j].on) aimOn = true;
        }
        return espOn || aimOn;
    }

    function updateEffects() {
        document.getElementById("espBox1").classList.toggle("show", getEsp("playerBox"));
        document.getElementById("espBox2").classList.toggle("show", getEsp("playerBox"));

        document.getElementById("espHealth1").classList.toggle("show", getEsp("healthBar"));
        document.getElementById("espHealth2").classList.toggle("show", getEsp("healthBar"));
        document.getElementById("espHBg1").classList.toggle("show", getEsp("healthBar"));
        document.getElementById("espHBg2").classList.toggle("show", getEsp("healthBar"));

        document.getElementById("espName1").classList.toggle("show", getEsp("playerName"));
        document.getElementById("espName2").classList.toggle("show", getEsp("playerName"));

        document.getElementById("espDist1").classList.toggle("show", getEsp("distance"));
        document.getElementById("espDist2").classList.toggle("show", getEsp("distance"));

        document.getElementById("espSkeleton").classList.toggle("show", getEsp("skeleton"));
        document.getElementById("espTracer").classList.toggle("show", getEsp("topTracer"));
        document.getElementById("enemyCount").classList.toggle("show", getEsp("enemyCount"));

        document.getElementById("aimCrosshair").classList.toggle("show", getAim("aimBot"));
        document.getElementById("aimNeck").classList.toggle("show", getAim("aimNeck"));
        document.getElementById("aimLock").classList.toggle("show", getAim("aimLock"));

        if (anyFeatureOn()) {
            startMatrix();
        } else {
            stopMatrix();
        }
    }

    function renderTab(tab) {
        currentTab = tab;
        container.innerHTML = "";
        var data = tabData[tab];

        if (data === "music") {
            var title = document.createElement("div");
            title.className = "section-title";
            title.textContent = "MUSIC";
            container.appendChild(title);

            for (var i = 0; i < musicList.length; i++) {
                (function(index) {
                    var div = document.createElement("div");
                    div.className = "music-item" + (currentMusic === index ? " playing" : "");
                    div.innerHTML =
                        '<div class="music-icon">' + (currentMusic === index ? "||" : ">") + '</div>' +
                        '<div class="music-name">' + musicList[index].name + '</div>';
                    div.addEventListener("click", function() { toggleMusic(index); });
                    container.appendChild(div);
                })(i);
            }
            return;
        }

        for (var i = 0; i < data.length; i++) {
            var div = document.createElement("div");
            div.className = "feature";
            div.innerHTML =
                "<span>" + data[i].name + "</span>" +
                '<div class="switch ' + (data[i].on ? "on" : "") + '" data-tab="' + tab + '" data-index="' + i + '"></div>';
            container.appendChild(div);
        }
    }

    container.addEventListener("click", function(e) {
        if (e.target.classList.contains("switch")) {
            var tab = e.target.dataset.tab;
            var idx = e.target.dataset.index;
            e.target.classList.toggle("on");
            tabData[tab][idx].on = e.target.classList.contains("on");
            updateEffects();
        }
    });

    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener("click", function() {
            var allTabs = document.querySelectorAll(".tab");
            for (var j = 0; j < allTabs.length; j++) allTabs[j].classList.remove("active");
            this.classList.add("active");
            renderTab(this.dataset.tab);
        });
    }

    function toggleMusic(index) {
        if (currentMusic === index) {
            audio.pause();
            currentMusic = -1;
        } else {
            audio.src = musicList[index].url;
            audio.loop = true;
            audio.play().catch(function(e) { console.log("Khong phat duoc:", e); });
            currentMusic = index;
        }
        renderTab("misc");
    }

    var menu = document.getElementById("menu");
    function showMenu() { menu.classList.add("show"); }
    function hideMenu() { menu.classList.remove("show"); }

    var threeFingerCount = 0;
    var resetTimer = null;

    document.addEventListener("touchstart", function(e) {
        if (e.touches.length === 3) {
            threeFingerCount++;
            clearTimeout(resetTimer);
            if (threeFingerCount >= 3) {
                if (menu.classList.contains("show")) hideMenu();
                else showMenu();
                threeFingerCount = 0;
            } else {
                resetTimer = setTimeout(function() { threeFingerCount = 0; }, 1000);
            }
        }
    }, { passive: true });

    document.addEventListener("keydown", function(e) {
        if (e.key === "m" || e.key === "M") {
            if (menu.classList.contains("show")) hideMenu();
            else showMenu();
        }
    });

    renderTab("esp");
    updateEffects();
</script>
</body>
</html>
